<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 580" role="img" aria-labelledby="two-stage-retrieval-title two-stage-retrieval-desc" font-family="Helvetica,Arial,sans-serif">
<title id="two-stage-retrieval-title">Two-stage retrieval evaluation</title>
<desc id="two-stage-retrieval-desc">The retriever sets the ceiling. The reranker reorders what it receives and cannot add documents.</desc>
<defs><marker id="two-stage-retrieval-arrow-047857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#047857"/></marker><marker id="two-stage-retrieval-arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker><marker id="two-stage-retrieval-arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker><marker id="two-stage-retrieval-arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b91c1c"/></marker><marker id="two-stage-retrieval-arrow-ea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#ea580c"/></marker></defs>
<rect width="1480" height="580" fill="#ffffff"/>
<text x="40" y="46" font-size="28" font-weight="700" fill="#121a2a">Two-stage retrieval evaluation</text>
<text x="40" y="74" font-size="14" fill="#556176">The retriever sets the ceiling. The reranker reorders what it receives and cannot add documents.</text>
<polyline id="r1" points="250.0,225.0 310.0,225.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#two-stage-retrieval-arrow-64748b)"/>
<polyline id="r2" points="510.0,225.0 570.0,225.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#two-stage-retrieval-arrow-64748b)"/>
<polyline id="r3" points="770.0,225.0 830.0,225.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#two-stage-retrieval-arrow-64748b)"/>
<polyline id="r4" points="925.0,165.0 925.0,135.0 1090.0,135.0" fill="none" stroke="#047857" stroke-width="1.8" marker-end="url(#two-stage-retrieval-arrow-047857)"/>
<polyline id="r5" points="1020.0,225.0 1195.0,225.0 1195.0,330.0" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#two-stage-retrieval-arrow-b91c1c)"/>
<polyline id="r6" points="925.0,285.0 925.0,370.0 670.0,370.0 670.0,280.0" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#two-stage-retrieval-arrow-ea580c)" stroke-dasharray="7 5"/>
<polyline id="r7" points="1195.0,440.0 1195.0,480.0 410.0,480.0 410.0,280.0" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#two-stage-retrieval-arrow-2563eb)" stroke-dasharray="7 5"/>
<g id="input">
<rect x="40" y="170" width="210" height="110" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
<text x="145.0" y="211.5" text-anchor="middle" font-size="16" font-weight="700" fill="#121a2a">Query set and qrels</text>
<text x="145.0" y="233.5" text-anchor="middle" font-size="13" fill="#556176">Queries plus judged relevance</text>
<text x="145.0" y="250.5" text-anchor="middle" font-size="13" fill="#556176">grades</text>
</g>
<g id="retrieve">
<rect x="310" y="170" width="200" height="110" rx="8" fill="#e8f0ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="410.0" y="197.5" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing=".7" fill="#2563eb">RETRIEVER</text>
<text x="410.0" y="218.5" text-anchor="middle" font-size="16" font-weight="700" fill="#121a2a">Retrieve candidates</text>
<text x="410.0" y="240.5" text-anchor="middle" font-size="13" fill="#556176">Search the corpus, return top</text>
<text x="410.0" y="257.5" text-anchor="middle" font-size="13" fill="#556176">40</text>
</g>
<g id="rerank">
<rect x="570" y="170" width="200" height="110" rx="8" fill="#fff0dd" stroke="#ea580c" stroke-width="1.8"/>
<text x="670.0" y="206.5" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing=".7" fill="#ea580c">RERANKER</text>
<text x="670.0" y="227.5" text-anchor="middle" font-size="16" font-weight="700" fill="#121a2a">Rerank candidates</text>
<text x="670.0" y="249.5" text-anchor="middle" font-size="13" fill="#556176">Reorder the 40, remove none</text>
</g>
<g id="judge">
<rect x="830" y="165" width="190" height="120" rx="8" fill="#fef3c7" stroke="#a16207" stroke-width="1.8"/>
<text x="925.0" y="211.5" text-anchor="middle" font-size="16" font-weight="700" fill="#121a2a">Score the run</text>
<text x="925.0" y="233.5" text-anchor="middle" font-size="13" fill="#556176">nDCG@10, Recall@40,</text>
<text x="925.0" y="250.5" text-anchor="middle" font-size="13" fill="#556176">Success@5</text>
</g>
<g id="report">
<rect x="1090" y="80" width="210" height="110" rx="8" fill="#dcfce7" stroke="#047857" stroke-width="1.8"/>
<text x="1195.0" y="130.5" text-anchor="middle" font-size="16" font-weight="700" fill="#121a2a">Metric report</text>
<text x="1195.0" y="152.5" text-anchor="middle" font-size="13" fill="#556176">Per-query scores and averages</text>
</g>
<g id="abstain">
<rect x="1090" y="330" width="210" height="110" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
<text x="1195.0" y="380.5" text-anchor="middle" font-size="16" font-weight="700" fill="#121a2a">Abstain</text>
<text x="1195.0" y="402.5" text-anchor="middle" font-size="13" fill="#556176">The query set lacks judgments</text>
</g>
<rect x="991.4" y="116.0" width="32.2" height="16" rx="3" fill="#ffffff"/>
<text x="1007.5" y="129.0" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">yes</text>
<rect x="1062.4" y="206.0" width="90.2" height="16" rx="3" fill="#ffffff"/>
<text x="1107.5" y="219.0" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">no judgments</text>
<rect x="747.6" y="351.0" width="99.8" height="16" rx="3" fill="#ffffff"/>
<text x="797.5" y="364.0" text-anchor="middle" font-size="12" font-weight="700" fill="#ea580c">ordering failure</text>
<rect x="757.1" y="461.0" width="90.8" height="16" rx="3" fill="#ffffff"/>
<text x="802.5" y="474.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">finding failure</text>
</svg>
