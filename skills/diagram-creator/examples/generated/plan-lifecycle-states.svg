<text x="370.0" y="206.5" text-anchor="middle" font-size="16" font-weight="700" fill="#121a2a">Scoped</text>
<text x="370.0" y="228.5" text-anchor="middle" font-size="13" fill="#556176">Policy compiled, budgets</text>
<text x="370.0" y="245.5" text-anchor="middle" font-size="13" fill="#556176">set</text>
</g>
