<polyline id="s3" points="700.0,220.0 760.0,220.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#plan-lifecycle-states-arrow-64748b)"/>
<polyline id="s4" points="940.0,220.0 1000.0,220.0" fill="none" stroke="#047857" stroke-width="1.8" marker-end="url(#plan-lifecycle-states-arrow-047857)"/>
<polyline id="s5" points="370.0,270.0 370.0,420.0" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#plan-lifecycle-states-arrow-b91c1c)" stroke-dasharray="7 5"/>
<polyline id="s6" points="850.0,270.0 850.0,420.0" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#plan-lifecycle-states-arrow-b91c1c)" stroke-dasharray="7 5"/>
