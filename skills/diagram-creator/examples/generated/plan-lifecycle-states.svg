<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 600" role="img" aria-labelledby="plan-lifecycle-states-title plan-lifecycle-states-desc" font-family="Helvetica,Arial,sans-serif">
<title id="plan-lifecycle-states-title">Plan lifecycle states</title>
<desc id="plan-lifecycle-states-desc">Every run ends in exactly one terminal state. A repair never returns to a closed stage.</desc>
<defs><marker id="plan-lifecycle-states-arrow-047857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#047857"/></marker><marker id="plan-lifecycle-states-arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker><marker id="plan-lifecycle-states-arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b91c1c"/></marker></defs>
<rect width="1300" height="600" fill="#ffffff"/>
<text x="40" y="46" font-size="28" font-weight="700" fill="#121a2a">Plan lifecycle states</text>
<text x="40" y="74" font-size="14" fill="#556176">Every run ends in exactly one terminal state. A repair never returns to a closed stage.</text>
<polyline id="s1" points="220.0,220.0 280.0,220.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#plan-lifecycle-states-arrow-64748b)"/>
